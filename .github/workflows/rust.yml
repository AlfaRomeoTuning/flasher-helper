name: Rust CI

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        sudo apt-get install -y gcc-arm-linux-gnueabihf

    - name: Install Rust toolchain for ARM
      run: rustup target add armv7-unknown-linux-gnueabihf

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Check
      run: cargo check

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Build Release for Cortex-A7
      run: cargo build --release --target armv7-unknown-linux-gnueabihf --verbose

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: target/armv7-unknown-linux-gnueabihf/release/flasher-helper
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}